<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#grad)"/>

  <!-- Magic wand / remove icon -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wand -->
    <line x1="16" y1="48" x2="38" y2="26"/>
    <!-- Wand tip sparkle -->
    <circle cx="42" cy="22" r="4" fill="white" stroke="none"/>
    <!-- Sparkles -->
    <line x1="48" y1="14" x2="48" y2="20"/>
    <line x1="45" y1="17" x2="51" y2="17"/>
    <line x1="52" y1="24" x2="52" y2="28"/>
    <line x1="50" y1="26" x2="54" y2="26"/>
  </g>
</svg>
