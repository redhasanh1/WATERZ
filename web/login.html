<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatermarkAI Sign In</title>
    <link rel="icon" type="image/png" href="emblem.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #e5e7eb;
            --text-secondary: #9aa4b2;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1e;
            color: #e0e0e0;
            margin: 0;
            min-height: 100vh;
            padding-top: 80px;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        /* Navigation Header */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 30, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            padding: 1.25rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.5rem;
            transition: transform 0.2s ease;
        }

        .nav-logo:hover {
            transform: translateY(-1px);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 2.25rem;
            list-style: none;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: -0.01em;
        }

        .nav-menu a:hover {
            color: var(--primary);
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2.5px;
            background: var(--gradient-primary);
            border-radius: 2px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            background: transparent;
            border: none;
            transition: background 0.3s ease;
        }

        .mobile-menu-toggle:hover {
            background: rgba(102, 126, 234, 0.12);
        }

        .mobile-menu-toggle span {
            width: 26px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 3px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }

        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1.5rem;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                top: 75px;
                left: 0;
                right: 0;
                flex-direction: column;
                gap: 0;
                background: rgba(15, 15, 30, 0.98);
                backdrop-filter: blur(20px);
                padding: 1.5rem 0;
                border-bottom: 1px solid rgba(102, 126, 234, 0.12);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .nav-menu.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            .nav-menu li {
                width: 100%;
                text-align: center;
                padding: 1rem 0;
                border-bottom: 1px solid rgba(102, 126, 234, 0.08);
            }

            .nav-menu li:last-child {
                border-bottom: none;
            }
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(26, 26, 46, 0.85);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(15, 15, 30, 0.45);
        }
        .tab-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(102, 126, 234, 0.25);
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }
        .tab-button {
            padding: 0.85rem 1rem;
            border: none;
            background: transparent;
            color: #a0a0c0;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .tab-button.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.35) 100%);
            color: #fff;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .tab-panel[hidden] { display: none; }
        .google-btn {
            background: white;
            color: #1a1a2e;
            border: 1px solid rgba(102, 126, 234, 0.3);
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .google-btn img {
            height: 18px;
            width: 18px;
            margin-right: 0.6rem;
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 1.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            color: #a0a0c0;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .alert {
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #c7c7f1;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(102, 126, 234, 0.35);
            background: rgba(15, 15, 30, 0.85);
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
        }
        input::placeholder {
            color: #7070a0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.35);
        }
        .footer-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
            color: #8080a8;
        }
        .footer-links a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <nav class="nav-header">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="40" height="40" rx="10" fill="url(#logoGradient)"/>
                    <path d="M12 14C12 12.8954 12.8954 12 14 12H26C27.1046 12 28 12.8954 28 14V26C28 27.1046 27.1046 28 26 28H14C12.8954 28 12 27.1046 12 26V14Z" fill="white" fill-opacity="0.2"/>
                    <circle cx="17" cy="17" r="2.5" fill="white" fill-opacity="0.9"/>
                    <path d="M14 24L18 20L22 24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.9"/>
                    <path d="M22 24L26 20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.9"/>
                    <circle cx="25" cy="15" r="2" fill="#10b981"/>
                </svg>
                <span>WatermarkAI</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#remove-watermark">Remove Objects</a></li>
                <li><a href="premium.html#pricing">Pricing</a></li>
                <li><a href="index.html#comparison">Results</a></li>
            </ul>

            <div class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="card">
        <h1>Welcome to WatermarkAI</h1>
        <p>Existing customers—from solo creators to full studios—can sign in, and new users can create accounts instantly.</p>
        <div id="authMessage" class="alert" hidden></div>

        <div class="tab-group" role="tablist" aria-label="Authentication options">
            <button class="tab-button active" id="tab-signin" data-target="panel-signin" role="tab" aria-controls="panel-signin" aria-selected="true">Sign in</button>
            <button class="tab-button" id="tab-signup" data-target="panel-signup" role="tab" aria-controls="panel-signup" aria-selected="false">Create account</button>
        </div>

        <div id="panel-signin" class="tab-panel active" role="tabpanel" aria-labelledby="tab-signin">
            <button type="button" id="googleSignIn" class="btn google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true">
                Continue with Google
            </button>
            <form id="loginForm">
                <label for="email">Work email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>

                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>

        <div id="panel-signup" class="tab-panel" role="tabpanel" aria-labelledby="tab-signup" hidden>
            <button type="button" id="googleSignup" class="btn google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true">
                Continue with Google
            </button>
            <form id="signupForm">
                <label for="signupName">Full name</label>
                <input type="text" id="signupName" name="signupName" placeholder="Alex Morgan" autocomplete="name" required>

                <label for="signupEmail">Work email</label>
                <input type="email" id="signupEmail" name="signupEmail" placeholder="you@agency.com" autocomplete="email" required>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" autocomplete="new-password" required>

                <button type="submit" class="btn">Create account</button>
            </form>
        </div>
        <div class="footer-links">
            <p><a href="index.html">← Back to Home</a></p>
            <p>Need pricing info first? <a href="premium.html#pricing">Explore plans</a></p>
        </div>
    </div>
    </div>

    <script>
        // Mobile Menu Toggle
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const navMenu = document.getElementById('navMenu');

        if (mobileMenuToggle && navMenu) {
            mobileMenuToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                mobileMenuToggle.classList.toggle('active');
            });

            // Close mobile menu when clicking a link
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    mobileMenuToggle.classList.remove('active');
                });
            });
        }
    </script>

    <script>
        // Auto-detect API base URL (works on Railway deployment)
        const API_BASE = window.API_BASE_URL || window.location.origin;

        const tabButtons = document.querySelectorAll('.tab-button');
        const panels = document.querySelectorAll('.tab-panel');
        const messageEl = document.getElementById('authMessage');

        const params = new URLSearchParams(window.location.search);
        const googleStatus = params.get('google');
        if (googleStatus && messageEl) {
            const messageText = params.get('message');
            const email = params.get('email');
            const name = params.get('name');
            messageEl.classList.remove('success', 'error');
            messageEl.removeAttribute('hidden');
            if (googleStatus === 'success') {
                const displayName = name || email || 'Google account';
                messageEl.classList.add('success');
                messageEl.textContent = `Signed in with ${displayName}. Connect this flow to your account system to finalize login.`;
            } else {
                messageEl.classList.add('error');
                messageEl.textContent = messageText || 'Google sign-in was cancelled or failed. Please try again.';
            }
            messageEl.style.display = 'block';
        }

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                panels.forEach(panel => {
                    panel.classList.remove('active');
                    panel.hidden = true;
                });
                button.classList.add('active');
                const targetId = button.dataset.target;
                const panel = document.getElementById(targetId);
                panel.classList.add('active');
                panel.hidden = false;
            });
        });

        document.getElementById('googleSignIn').addEventListener('click', () => {
            const target = API_BASE ? `${API_BASE}/auth/google` : '/auth/google';
            window.location.href = target;
        });

        document.getElementById('googleSignup').addEventListener('click', () => {
            const target = API_BASE ? `${API_BASE}/auth/google?flow=signup` : '/auth/google?flow=signup';
            window.location.href = target;
        });

        // Email + password login (sign in)
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email) {
                showMessage('Please enter your email', 'error');
                return;
            }

            if (!password) {
                showMessage('Please enter your password', 'error');
                return;
            }

            await emailLogin(email, password);
        });

        // Email + password signup (create account)
        document.getElementById('signupForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!name) {
                showMessage('Please enter your name', 'error');
                return;
            }

            if (!email) {
                showMessage('Please enter your email', 'error');
                return;
            }

            if (!password) {
                showMessage('Please enter your password', 'error');
                return;
            }

            await emailLogin(email, password, name);
        });

        // Email + password login function (handles both signin and signup)
        async function emailLogin(email, password, name = null) {
            const messageEl = document.getElementById('authMessage');
            showMessage('Processing...', '');

            try {
                const apiUrl = API_BASE ? `${API_BASE}/api/auth/register` : '/api/auth/register';

                const payload = { email, password };
                if (name) {
                    payload.name = name;
                }

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Store user in localStorage
                    localStorage.setItem('user', JSON.stringify(data));

                    showMessage(data.message || 'Success! Redirecting...', 'success');

                    // Redirect to main app
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(data.error || 'Login failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Connection error. Please try again.', 'error');
            }
        }

        // Show message helper
        function showMessage(text, type) {
            const messageEl = document.getElementById('authMessage');
            if (!messageEl) return;

            messageEl.classList.remove('success', 'error');
            if (type) messageEl.classList.add(type);
            messageEl.textContent = text;
            messageEl.style.display = 'block';
            messageEl.removeAttribute('hidden');
        }
    </script>

</body>
</html>
